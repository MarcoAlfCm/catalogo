name: Deploy catalogo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy en VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/catalogo_deploy_key
          chmod 600 ~/.ssh/catalogo_deploy_key

          ssh -i ~/.ssh/catalogo_deploy_key \
              -p "$VPS_PORT" \
              -o StrictHostKeyChecking=no \
              "$VPS_USER@$VPS_HOST" \
              "bash /opt/catalogo/deploy.sh"
